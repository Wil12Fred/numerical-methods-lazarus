name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal and Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lazarus lazarus-src xvfb xauth

      - name: Versions
        run: |
          fpc -iV
          lazbuild --version

      - name: Register the cmdbox package
        # cmdbox ships with Lazarus but is not registered by the Debian package
        run: |
          lpk=$(find /usr/lib/lazarus /usr/share/lazarus -name cmdbox.lpk 2>/dev/null | head -1)
          echo "cmdbox: $lpk"
          if [ -z "$lpk" ]; then find / -xdev -name "*.lpk" 2>/dev/null | grep -i -e cmd -e chart -e lcl.lpk; dpkg -L lazarus-src-3.0 | grep -i cmd | head; fi
          lazbuild --add-package-link "$lpk"

      - name: Build the GUI (lazbuild)
        run: lazbuild project1.lpi

      - name: Smoke-run the GUI headless
        run: |
          set +e
          xvfb-run -a timeout 10 ./project1
          code=$?
          echo "exit code: $code"
          # 124 = still running when the timeout fired = the window came up
          test "$code" -eq 124

      - name: Build the numerical tests
        run: lazbuild tests/numerictests.lpi

      - name: Run the numerical tests
        run: xvfb-run -a timeout 120 ./tests/numerictests
