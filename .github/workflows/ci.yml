name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal and Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lazarus xvfb xauth unzip

      - name: Versions
        run: |
          fpc -iV
          lazbuild --version

      - name: Fetch and register the cmdbox package
        # Debian/Ubuntu's Lazarus does not ship cmdbox; it lives in the
        # Online Package Manager (CmdLine.zip). The checksum is pinned.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/CmdLine.zip" https://packages.lazarus-ide.org/CmdLine.zip
          echo "5190b2346563cab2e59244065bb53af802e596bda106953a6e50b53ea0f0bd99  $RUNNER_TEMP/CmdLine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/CmdLine.zip" -d "$RUNNER_TEMP/opm"
          lazbuild --add-package-link "$RUNNER_TEMP/opm/CmdLine/cmdbox.lpk"

      - name: Build the GUI (lazbuild)
        run: lazbuild project1.lpi

      - name: Smoke-run the GUI headless
        run: |
          set +e
          xvfb-run -a timeout 10 ./project1
          code=$?
          echo "exit code: $code"
          # 124 = still running when the timeout fired = the window came up
          test "$code" -eq 124

      - name: Build the numerical tests
        run: lazbuild tests/numerictests.lpi

      - name: Run the numerical tests
        run: xvfb-run -a timeout 120 ./tests/numerictests
